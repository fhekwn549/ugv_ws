# Mosquitto config for UGV Bridge
# Install: sudo apt install mosquitto mosquitto-clients
# Deploy: sudo cp this_file /etc/mosquitto/conf.d/ugv_bridge.conf
# Restart: sudo systemctl restart mosquitto

# Native MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser MQTT.js)
listener 1884
protocol websockets

# Allow anonymous access (local network only)
allow_anonymous true
