# RabbitMQ config for UGV Bridge
# Replaces Mosquitto — supports MQTT + STOMP + Web STOMP simultaneously
#
# Install: sudo apt install rabbitmq-server
# Deploy:  sudo cp this_file /etc/rabbitmq/rabbitmq.conf
#          sudo cp enabled_plugins /etc/rabbitmq/enabled_plugins
# Restart: sudo systemctl restart rabbitmq-server

# ── MQTT plugin (for Bridge node / paho-mqtt) ──
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = true
mqtt.exchange = amq.topic

# ── STOMP plugin (for MES/ERP, future) ──
stomp.listeners.tcp.default = 61613

# ── Web STOMP plugin (for Dashboard / @stomp/stompjs) ──
web_stomp.ws_frame = binary
web_stomp.cowboy_opts.idle_timeout = 60000

# ── Management UI ──
management.listener.port = 15672
