/**:
  ros__parameters:
    # ── Robot fleet configuration ──
    # Comma-separated robot IDs
    robot_ids: "ugv01"

    # Per-robot ROS topic prefix (empty = root namespace, e.g. "" → /odom, "ugv01" → /ugv01/odom)
    # When RPi uses ROS namespace, set the matching prefix here
    ugv01_topic_prefix: ""

    # ── STOMP broker (RabbitMQ Web STOMP on WSL) ──
    stomp_host: "192.168.0.85"
    stomp_port: 15674
    stomp_user: "stomp-mq"
    stomp_password: "stomp-mq"

    # ── FastAPI server ──
    api_host: "0.0.0.0"
    api_port: 8081

    # ── SQLite database ──
    db_path: "~/ugv_bridge.db"

    # ── Frontend static files (npm run build output) ──
    static_dir: ""

    # ── Publishing rates (Hz) ──
    pose_rate: 5.0
    voltage_rate: 0.2
    joint_rate: 3.0
    scan_rate: 2.0
    sensor_snapshot_interval: 10.0

    # LiDAR downsampling: keep every Nth point
    scan_downsample: 4

    # cmd_vel watchdog timeout (seconds)
    cmd_vel_timeout: 0.5

    # DB retention (days)
    db_retention_days: 30
